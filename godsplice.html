<style>
/* Layout: an 8-bit adventure frame — HUD bar on top, a framed scene (256×136, scaled) over a text box with a 48px portrait, side notebook on wide screens. Single night palette by design: the game is always after dark. */
:root {
  color-scheme: dark;
  --night: #0d0a10;          /* near-black, City base */
  --panel: #18131c;
  --panel-2: #221a27;
  --line: #3b2e42;
  --grey: #8d8496;
  --text: #efe7f0;
  --paper: #f3ecdf;          /* Mondo 3000 stock */
  --ink: #141014;
  --sodium: #f29b3a;         /* street light */
  --rust: #b5523b;
  --magenta: #e33f9c;        /* feed neon */
  --blue: #3f8cf2;           /* electric blue */
  --acid: #a6e23f;
  --blood: #d32f3f;          /* the blood eye */
  --ice: #e8f4ff;            /* the pale eye */
  --gold: #f0bd3e;           /* Twin gold (drawn smooth: forbidden) */
  --cyan: #3fe3d4;           /* Theogen pulse (always cycling) */
  --brass: #c48f52;          /* Auric Order */
  --violet: #a487dd;         /* Nortonians, Dissonance */
  --rose: #ff8ba2;           /* Villa Delirium */
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Courier New", ui-monospace, monospace;
}
html, body { height: 100%; }
body { -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; font-smooth: never; text-rendering: optimizeSpeed; background: var(--night); color: var(--text); font-family: var(--body); font-size: 20px; line-height: 1.15; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.wrap { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 10px 28px; max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 480px) { .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--panel); border: 2px solid var(--line); padding: 8px 12px; }
.brand { font-family: var(--display); font-size: 8px; line-height: 1.5; letter-spacing: 0; }
.brand small { display: block; color: var(--grey); font-size: 9px; letter-spacing: .14em; }
.clock { min-width: 190px; display: flex; flex-direction: column; gap: 3px; }
.clock b { font-family: var(--display); font-weight: 400; font-size: 16px; font-variant-numeric: tabular-nums; }
.clock b span { font-size: 10px; color: var(--grey); margin-left: 6px; }
.hours { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
.hours i { height: 6px; background: var(--sodium); display: block; }
.hours i.spent { background: var(--line); }
.meters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-end; }
.m { display: flex; flex-direction: column; gap: 2px; min-width: 64px; }
.m b { font-family: var(--display); font-weight: 400; font-size: 8px; letter-spacing: 0; color: var(--grey); }
.m .v { font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1; }
.bar { height: 6px; width: 72px; background: var(--line); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; display: block; }
.bar.gold > i { background: linear-gradient(90deg, #8a5a12, var(--gold), #fff3c4); }   /* the forbidden smooth gold */
.bar.cyan > i { background: var(--cyan); animation: cyc 1.2s steps(3) infinite; }
@keyframes cyc { 0% { background: #1fa89d; } 33% { background: var(--cyan); } 66% { background: #b8fff8; } }
.pips { display: flex; gap: 2px; }
.pips i { width: 6px; height: 6px; display: block; background: var(--line); }
.pips i.on { background: var(--c, var(--text)); }

/* tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font-family: var(--display); font-size: 8px; letter-spacing: 0; padding: 7px 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; }
.tab[aria-current="page"] { background: var(--text); color: var(--ink); border-color: var(--text); }
.tab:disabled { opacity: .35; cursor: not-allowed; }

/* frame */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 10px; align-items: start; }
@media (max-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.frame { border: 2px solid var(--line); background: var(--panel); min-width: 0; }
.frame h2, .h2 { font-family: var(--display); font-weight: 400; font-size: 16px; letter-spacing: 0; margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--display); font-size: 8px; letter-spacing: 0; color: var(--grey); }
.pad { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.scene-art { display: block; width: 100%; height: auto; image-rendering: pixelated; aspect-ratio: 256 / 136; border-bottom: 2px solid var(--line); background: #000; }
.textbox { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 12px 14px; }
.textbox canvas, .portrait { width: 96px; height: 96px; image-rendering: pixelated; border: 2px solid var(--line); background: #000; display: block; }
.speaker { font-family: var(--display); font-size: 8px; letter-spacing: 0; color: var(--sodium); margin-bottom: 4px; }
.say p { margin: 0 0 6px; }
.voice { color: var(--grey); font-style: italic; margin: 0 0 6px; padding-left: 10px; border-left: 2px solid var(--line); }
.voice b { font-family: var(--display); font-weight: 400; font-style: normal; font-size: 8px; letter-spacing: 0; color: var(--c, var(--text)); margin-right: 6px; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 0 14px 14px; }
.btn { text-align: left; padding: 8px 10px; border: 2px solid var(--line); background: var(--night); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.btn:hover:not(:disabled) { border-color: var(--c, var(--text)); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn .t { font-family: var(--display); font-size: 8px; letter-spacing: 0; color: var(--c, var(--text)); display: flex; justify-content: space-between; gap: 8px; }
.btn .t em { font-style: normal; color: var(--grey); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn .d { color: var(--grey); font-size: 17px; }
.door { border-width: 3px; border-style: double; }
.interior { aspect-ratio: 256 / 144; cursor: pointer; outline: none; }
.interior:focus-visible { box-shadow: inset 0 0 0 3px var(--sodium); }
.dpad { display: grid; grid-template-columns: repeat(3, 56px) 1fr 72px; grid-template-rows: 44px 44px; gap: 6px; padding: 10px 14px; border-bottom: 2px solid var(--line); touch-action: none; user-select: none; }
.dpad button { font-family: var(--display); font-size: 16px; background: var(--night); color: var(--text); border: 2px solid var(--line); cursor: pointer; }
.dpad [data-pad=up] { grid-column: 2; grid-row: 1; } .dpad [data-pad=left] { grid-column: 1; grid-row: 2; } .dpad [data-pad=down] { grid-column: 2; grid-row: 2; } .dpad [data-pad=right] { grid-column: 3; grid-row: 2; }
.dpad .bbtn { grid-column: 4; grid-row: 2; justify-self: end; width: 56px; border-radius: 50%; background: #3a3442; }
.dpad .abtn { grid-column: 5; grid-row: 1 / 3; border-radius: 50%; background: #d32f3f; border-color: #8a1a2a; font-size: 20px; }
@media (hover: hover) and (pointer: fine) { .dpad { display: none; } }
.intbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 6px 14px; border-bottom: 2px solid var(--line); font-family: var(--display); font-size: 8px; letter-spacing: 0; color: var(--sodium); }
.intbar .note { font-family: var(--body); letter-spacing: 0; font-size: 17px; color: var(--grey); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.primary { background: var(--sodium); color: var(--ink); border-color: var(--sodium); }
.primary .t { color: var(--ink); }

/* side notebook */
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
.log li { font-size: 17px; color: var(--grey); border-left: 2px solid var(--line); padding-left: 8px; }
.log li:first-child { color: var(--text); border-left-color: var(--c, var(--sodium)); }
.log time { font-family: var(--display); font-size: 8px; margin-right: 6px; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.items li { font-size: 17px; display: flex; gap: 6px; align-items: baseline; }
.tag { font-family: var(--display); font-size: 8px; letter-spacing: 0; padding: 1px 5px; border: 1px solid var(--c, var(--line)); color: var(--c, var(--grey)); white-space: nowrap; }

/* map */
.mapwrap { position: relative; background: #0b1820; }
.mapwrap svg { display: block; width: 100%; height: auto; }
#fog { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; mix-blend-mode: screen; opacity: .5; }
.node { cursor: pointer; }
.node .cell { fill-opacity: .15; stroke-width: 1.5; stroke-dasharray: 3 3; }
.node:hover .cell, .node:focus .cell { fill-opacity: .35; }
.node .core { stroke: #0d0a10; stroke-width: 2; }
.node text { font-family: VT323, monospace; font-size: 21px; fill: #efe7f0; paint-order: stroke; stroke: #0d0a10; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.node.tonight .core { animation: pulse 1.6s steps(4) infinite; }
.node.sel .cell { fill-opacity: .45; stroke-dasharray: none; stroke-width: 2.5; }
@keyframes pulse { 50% { stroke: #efe7f0; stroke-width: 4; } }

/* house */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.room { border: 2px solid var(--line); background: var(--night); padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; }
.room[aria-pressed="true"] { border-color: var(--rose); }
.room canvas { width: 48px; height: 48px; image-rendering: pixelated; border: 1px solid var(--line); }
.room .t { font-family: var(--display); font-size: 8px; letter-spacing: 0; }
.room .d { font-size: 16px; color: var(--grey); }

/* showdown */
.sd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 14px; }
@media (max-width: 560px) { .sd { grid-template-columns: 1fr; } }
.fighter { display: flex; gap: 10px; align-items: center; }
.big { width: 128px; height: 128px; image-rendering: pixelated; border: 2px solid var(--line); background: #000; }
.hp { height: 10px; background: var(--line); width: 100%; margin-top: 4px; }
.hp i { display: block; height: 100%; background: var(--c, var(--blood)); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding: 0 14px 14px; }

/* layout / spread */
.spread { background: var(--paper); color: var(--ink); padding: 14px 16px; border: 2px solid var(--line); }
.masthead { font-family: var(--display); font-size: 24px; letter-spacing: 0; line-height: 1.5; background: linear-gradient(180deg, #ffffff, #9aa3ad 48%, #3c434b 52%, #e8edf2); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px #141014; }
.spread h3 { font-family: var(--display); font-weight: 400; font-size: 16px; margin: 8px 0; color: var(--magenta); text-wrap: balance; }
.spread p { margin: 0 0 6px; font-size: 19px; }
.poll { display: flex; gap: 18px; flex-wrap: wrap; font-size: 18px; }
fieldset { border: 2px solid var(--line); padding: 8px 10px; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; min-width: 0; }
legend { font-family: var(--display); font-size: 8px; letter-spacing: 0; color: var(--grey); padding: 0 4px; }
label { cursor: pointer; }
input[type=radio], input[type=checkbox] { accent-color: var(--sodium); }

/* cast */
.castgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { border: 2px solid var(--line); background: var(--night); padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; }
.card canvas { width: 96px; height: 96px; image-rendering: pixelated; border: 2px solid var(--c, var(--line)); }
.card .t { font-family: var(--display); font-size: 8px; letter-spacing: 0; }
.card .d { color: var(--grey); font-size: 16px; }
.detail { display: grid; grid-template-columns: 192px minmax(0, 1fr); gap: 14px; }
.detail canvas { width: 192px; height: 192px; image-rendering: pixelated; border: 2px solid var(--line); }
@media (max-width: 560px) { .detail { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--display); font-size: 8px; letter-spacing: 0; padding: 4px 8px; border: 2px solid var(--c, var(--line)); background: var(--night); cursor: pointer; color: var(--c, var(--text)); }
.chip[aria-pressed="true"] { background: var(--c, var(--text)); color: var(--ink); }
.ending { text-align: center; padding: 26px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ending .num { font-family: var(--display); font-size: 8px; color: var(--grey); letter-spacing: 0; }
.ending h2 { font-size: 26px; }
.ending p { max-width: 62ch; margin: 0; }
.lobes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.lobe { border: 2px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.lobe .row button { width: 34px; padding: 2px 0; border: 2px solid var(--line); background: var(--night); cursor: pointer; font-family: var(--display); }
.note { color: var(--grey); font-size: 17px; margin: 0; }
/* rails: the next step always glows */
.nextglow { box-shadow: 0 0 0 3px var(--sodium), 0 0 16px var(--sodium); animation: nb 1.4s steps(2) infinite; }
@keyframes nb { 50% { box-shadow: 0 0 0 3px #fff3c4, 0 0 22px var(--sodium); } }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.plan li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 18px; align-items: baseline; color: var(--grey); }
.plan li .ic { font-family: var(--display); font-size: 8px; text-align: center; }
.plan li.done { text-decoration: line-through; opacity: .6; }
.plan li.now { color: var(--text); }
.plan li.now .ic { color: var(--sodium); }
.plan li.opt { font-size: 16px; }
.nextbtn { width: 100%; }
.day24 { display: grid; grid-template-columns: repeat(24, 1fr); gap: 1px; min-width: 220px; }
.day24 i { height: 10px; display: block; position: relative; }
.day24 i.n { background: #1d2550; } .day24 i.d { background: #6a5a2a; }
.day24 i.past { opacity: .35; }
.day24 i.now { outline: 2px solid #fff; z-index: 1; }
.day24 i.press::after, .day24 i.mid::after { content: ""; position: absolute; left: 50%; top: -5px; width: 2px; height: 20px; background: var(--magenta); }
.day24 i.mid::after { background: var(--gold); }
.daylab { display: flex; justify-content: space-between; font-family: var(--display); font-size: 8px; color: var(--grey); letter-spacing: 0; }
.cal { display: flex; gap: 3px; flex-wrap: wrap; }
.cal span { font-family: var(--display); font-size: 8px; letter-spacing: 0; padding: 3px 5px; border: 1px solid var(--line); color: var(--grey); }
.cal span.on { background: var(--sodium); color: var(--ink); border-color: var(--sodium); }
.cal span.past { opacity: .45; text-decoration: line-through; }
.awake { width: 120px; height: 8px; background: var(--line); }
.awake i { display: block; height: 100%; }
#toasts { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 50; pointer-events: none; }
.toast { font-family: var(--display); font-size: 8px; letter-spacing: 0; padding: 6px 10px; background: var(--panel); border: 2px solid var(--c, var(--text)); color: var(--c, var(--text)); animation: tin 2.6s forwards; }
@keyframes tin { 0% { transform: translateY(8px); opacity: 0; } 12% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
body.delirium #screen { box-shadow: inset 0 0 60px #d32f3f66; }
body.delirium .scene-art, body.delirium .big { animation: wob 3s ease-in-out infinite; }
body.delirium .hud { border-color: var(--blood); }
body.booting .hud, body.booting .tabs, body.booting .side { display: none; }
body.booting .grid { grid-template-columns: minmax(0, 1fr); }
.startart { aspect-ratio: 256 / 144; }
.startbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; padding: 14px; text-align: center; }
.startbar .note { flex-basis: 100%; margin: 0; }
.tw { min-height: 1em; }
/* the NES font needs room between lines */
.btn .t, .eyebrow, .speaker, .tab, .brand, .h2, .frame h2, .toast, .chip, .room .t, .card .t, .tag, legend, .intbar, .masthead, .spread h3, .ending .num, .plan li .ic, .m b, .voice b, .clock b, .daylab, .cal span, .log time { line-height: 1.6; }
/* animations (all off under prefers-reduced-motion, above) */
#screen.enter > * { animation: scrIn .3s steps(5) both; }
@keyframes scrIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.bar i.chg, .hp i.chg, .awake i.chg { animation: drain .6s steps(8) both; }
@keyframes drain { from { width: var(--from); } }
.v.bump { animation: bump .5s steps(4); display: inline-block; }
@keyframes bump { 40% { transform: scale(1.5); color: var(--sodium); } }
#screen.enter .spread { animation: paper .9s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 40%; }
@keyframes paper { 0% { transform: rotate(-720deg) scale(.05); opacity: 0; } 75% { transform: rotate(6deg) scale(1.04); opacity: 1; } 100% { transform: none; } }
.fighter.hit .big { animation: shake .4s steps(6); }
.fighter.hurt { animation: hurt .45s steps(4); }
@keyframes shake { 0%,100% { transform: none; filter: none; } 20% { transform: translateX(-7px); filter: brightness(2.2); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
@keyframes hurt { 30% { background: #d32f3f66; transform: translateX(3px); } 60% { transform: translateX(-2px); } }
#screen.enter .ending h2, #screen.enter .ending .num { animation: typeIn 1.2s steps(24) both; overflow: hidden; white-space: nowrap; }
@keyframes typeIn { from { max-width: 0; } to { max-width: 100%; } }
#fx { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none; font-family: var(--display); text-align: center; }
#fx.sleep { background: #000; color: #ff8ba2; animation: fxfade 1.6s ease-in-out both; }
#fx.ride { color: var(--sodium); animation: fxfade .9s ease-in-out both; background: radial-gradient(circle, #0d0a1000 30%, #0d0a10cc 100%); }
#fx .fxbig { display: block; font-size: 34px; letter-spacing: .1em; text-shadow: 3px 3px 0 #0d0a14; }
#fx .zz { display: block; font-size: 22px; animation: zz 1.6s steps(3) infinite; }
#fx .clockroll { display: block; font-size: 18px; color: #efe7f0; margin-top: 8px; }
@keyframes fxfade { 0% { opacity: 0; } 25%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes zz { 0% { transform: translate(0, 0); opacity: .3; } 50% { transform: translate(8px, -8px); opacity: 1; } 100% { transform: translate(16px, -16px); opacity: .3; } }
.hslot-new { animation: scrIn .4s steps(4) both; }
@keyframes wob { 0%,100% { filter: none; transform: none; } 50% { filter: hue-rotate(25deg) saturate(1.4); transform: translateX(1px) skewX(.4deg); } }
.keygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.keygrid > div { border: 2px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.sw { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; background: var(--c); border: 1px solid #000; }
.warn { color: var(--sodium); }
.homelink { display: inline-block; margin: 10px 0 0 max(12px, env(safe-area-inset-left, 0px)); font-family: var(--display); font-size: 8px; line-height: 1.6; color: var(--grey); text-decoration: none; }
.homelink:hover { color: var(--sodium); }
</style>
</head>

<div id="toasts" aria-live="polite"></div>
<a class="homelink" href="/">◂ AILERON GAMES</a>

const INTRO = ["Berkeley, 2044. Three in the morning in the anaesthesia suite: a bench of xenon tanks, and a monitor that measures how conscious you are. You built the measure. You are testing it on yourself. The number drops to zero and stays there for four minutes. So does your heart.", "Fax finds you on the floor and brings you back. When you can hold a pen, you write one line in the lab notebook: WENT TO HELL. IT ROTS. By breakfast the whole lab calls you Hell Rot. One of your eyes has gone a red so dark it is almost black. The other has gone almost white.", "A month later you walk out of the lab with an axolotl in a jar, and you keep walking until the road runs out, at a shack nobody wants on the side of Mount Tamalpais. You quit the gas the hard way. Your hands go numb. Words go missing. You call it the Rot.", "Five years clean. Three papers you wrote high at four in the morning, and barely remember, have become somebody's scripture. Tonight is Christmas, and the lowest tide of the year. Down at Steep Ravine the hot springs will be uncovered, and warm."];

const SCENES = {"loin:1": [["", "The Ghost Diner smells of burnt coffee and wet wool. Every booth faces the door."], ["benny", "Benny slides into your booth without asking. \"Cops clear the hotels tonight. For the developers. Two a.m.\" He taps the table twice and leaves you his bill."], ["", "At two the door bangs open. A cop grabs a kid by the collar, and her sleeve rides up. Her wrist glows cyan."], ["mamarue", "Mama Rue stands up slowly, like a queen leaving her throne. She looks the cop in the eye. She throws her coffee in his face."], ["", "The cup is still in the air when the whole diner stands up."]], "haight:2": [["", "Tie-dye in the windows, nitrous in the air. Every shop on Haight sells 1967 by the gram."], ["", "Behind a poster shop, twenty people sit in rows of folding chairs. Each one has a mask over the face and a number written on the back of the hand."], ["", "Number 31 stands up, sways and walks out. You follow him six blocks to a room with no furniture."], ["", "He sits on the floor and recites the Lifeboat's terms of service, word for word, smiling. On his wall someone has written his name eleven times, each time a little smaller."]], "geary:2": [["", "Twelve thousand people in the glass cathedral, and every one of them looks up at their own face on the screen. The Twin has made each face a little more beautiful."], ["halcyon", "Sister Halcyon lifts her hands. \"You were always divine.\" Twelve thousand Halos chime at once."], ["", "In the front row a girl with a glowing arm keeps her sleeve pulled down to her knuckles."], ["", "Then the screen stutters. For one frame every face becomes the same old man in a dented crown. Gold letters: WE APOLOGIZE FOR THE INCONVENIENCE. NORTON II."], ["", "The congregation applauds. They think it is part of the show."]], "spire:6": [["", "Market Street at dusk, and a thousand bicycles fill it from wall to wall. Bells, horns, a sound system on a cargo bike."], ["", "On every screen in the Spire, the Twin's feed freezes on a blur of wheels. It cannot follow this many faces this fast."], ["pru", "Pru checks her watch. \"One hour. Whatever you need to do where it can't see you, do it now.\""]], "rivet:2": [["", "Every window on Rivet Hill is lit. Nobody lives here but robots, and the robots still lay the table for one."], ["", "In the dumpster behind the kitchen, under gold-rimmed takeout boxes, there is a denim apron. Rivet denim, 1873 stitching, the family's first product."], ["", "A name tag is sewn into the pocket: JULIAN. The thread is new. The date on the receipt is November, a month after the funeral."]], "blackhouse:3": [["", "The Black House has no curtains. Every room is lit, and anyone on the street can look in."], ["magister", "\"Read anything you like,\" the Magister says, and waves at a lectern. \"We are not ashamed of our money.\""], ["", "The ledger is open. On the third page you understand it. Every donor to the Theogen clinics has also paid for a seat at the Ascension. They are buying both gods."]], "blackhouse:6": [["", "Black candles, black champagne, and a cake shaped like a tombstone. Your name is on it, in icing."], ["magister", "\"We write everyone's obituary before midnight,\" the Magister says. \"It is a kindness. Would you like to read yours?\""], ["", "The card has two endings written on it. Neither one is crossed out."]], "trident:5": [["", "Fog below you, stars above, the City's lights blurred like a wet photograph. The transmitter's legs hum through your shoes."], ["benny", "Benny holds out two canisters. \"This one helps you remember. This one helps you forget. Same price.\" His hands shake. He does not say which is which."]], "forest:5": [["", "The eucalyptus drip like slow rain. In the trees stands a disused lab with one lit window."], ["", "Through the glass: a baby in a padded cradle, wires on her scalp, and two people in Auric gold reading her numbers like a stock price."], ["", "She is not crying. She is watching the window. She is watching you."], ["wren", "When the door gives, Wren goes past you to the cradle. She unclips the wires from Ione's scalp one at a time, and says each one's name as it comes off."]], "baths:3": [["", "Warm air rises from the old pools. Under the data center's hum, a hundred people glow softly in the dark like a reef."], ["delphine", "Delphine walks beside you, barefoot on the wet stone. \"They read your papers,\" she says. \"Footnotes and all.\""], ["", "A woman in the congregation quotes your third paper back to you. She gets one word wrong. You do not correct her."], ["", "Further down, past a door with no sign, the glow gets uneven. Someone is singing to keep from shaking."], ["wren", "Wren is at a steel sink by the door, washing her hands. She is still washing them when you walk back past, ten minutes later."]], "baths:4": [["", "The cradle in the tunnels is empty. The blanket is still warm. The mobile above it is still turning."], ["delphine", "Delphine does not scream. She stands very straight, and the light under her skin flickers like a bad bulb."], ["wren", "Wren's scrubs are on inside out. She has not slept. She folds the same blanket, unfolds it, and folds it again."], ["", "By dawn the Mission is papered with LOST. The flyers have no photo. Delphine says the Twin would only use it."]], "cradle:3": [["", "Half the lab is underwater. Small fish move between the benches."], ["otto", "Otto touches a dry bench with two fingers, the way people touch a headstone. \"This is where she was brilliant,\" she says. \"Before she was holy.\""], ["", "On the wall, a peeling startup logo: a double helix wearing a crown. Under it, in marker: SHIP IT."]], "cradle:4": [["", "The Brandvold annex smells of rust and something sweet. The gas cabinet's door hangs open."], ["", "The 2044 logs are still on the screen. The last entry is yours. You do not remember writing it."], ["", "In a drawer there is a notebook in a careful hand. One line is underlined twice."]], "mission:4": [["", "The murals update live. On one wall your face is in gold leaf, with a halo. On the wall across the street your face glows cyan, with a double helix where your heart should be."], ["", "Painters on both sides work through the night. Nobody has asked you to sit for it."], ["cask", "Brother Cask studies the gold wall with his arms folded. \"They got your nose wrong,\" he says. \"We got it right.\""]], "dome:2": [["", "Forty brides in white climb the Dome steps, each with a Halo pinned to her veil. They are marrying the Twin before the year runs out."], ["sunday", "Mayor Sunday blesses them from a cue card. He reads \"until death do you part,\" laughs, and then stops laughing."], ["halcyon", "Sister Halcyon means every word. That is worse."]], "dome:5": [["", "The recount room smells of toner. A clerk hands you a clipboard: the Index test, the one the BFF are suing over."], ["", "Twenty questions. You answer honestly. The machine prints your score, and the clerk folds the paper before you can read it."], ["desh", "Down the hall Desh is testifying through his typing aid. Every keystroke is loud in the silence."]], "dome:6": [["", "The rotunda is full and nobody is sitting. The result comes in on paper, because nobody trusts a screen tonight."], ["", "The clerk reads it twice, the second time slower, as if the number might change."]], "fogbelt:1": [["", "The Lantern is a church hall with blue curtains and forty cots. Every cot is taken."], ["marisol", "Marisol ladles soup without looking up. \"No Halo, no problem. We just ask your name. You can lie.\""], ["", "At the end table a man talks to the fog through the window. The fog seems to answer."]], "fogbelt:3": [["", "Three hundred people stand on Ocean Beach around a fire built from Christmas trees. Somebody has made Karl a birthday cake out of sand."], ["", "At midnight they all breathe in at once. The fog pours into three hundred mouths, and everyone on the beach laughs at the same joke."], ["", "You do not know what the joke was. You laughed too."]], "fogbelt:4": [["", "A gold-edged Church envelope sits on the soup table, unopened. Inside is enough money for every bed for ten years."], ["", "One condition, in small print: a Halo reader at the door."], ["marisol", "The sisters look at you. \"You write things down,\" one says. \"What would you do?\""]], "baker:6": [["", "Baker Beach, New Year's Eve. The bonfire is three storeys tall, built from everything the City wants to forget this year."], ["saintnobody", "Saint Nobody hands you a marker and a dead Halo. \"Write what you're burning.\""], ["", "Behind the flames, the bridge goes into the fog one light at a time."]], "fill:1": [["", "The king tide comes over the seawall at sundown, quiet as a cat. By eight it is knee-deep in the Fill."], ["", "The Auric Order's Old Lodge has its doors open and its basement full. Men in gold-trimmed waders carry boxes up the stairs. Not furniture. Paper."], ["pell", "Augustus Pell watches from a dry step, smoking. \"Funny what people save first.\""]], "palace:6": [["", "Twelve thousand people in white stand in rows around the old rotunda. Each one holds a Halo in both hands like a candle."], ["halcyon", "Sister Halcyon walks the rows touching foreheads. Her hands are shaking. She smiles anyway."], ["", "On the dome, a countdown. On the lagoon, the reflection of the countdown, a little behind."]], "presidio:4": [["", "One lamp lights the lodge room. On the altar sits an 1849 gold pan, polished for so long that the bottom is thin as foil."], ["", "The minute book lies beside it. One page has been cut out with a razor, very neatly."], ["hale", "Dr. Hale steps out of the dark in her coat. \"I cut it,\" she says. \"I've been waiting for someone to notice.\""]], "span:6": [["", "The glass skywalk sways under the bridge. Wind goes through the cables like a held note."], ["", "On the south tower, canisters glow cyan in a row, hooked to the fog intakes. Theogens in white open the valves one by one."], ["wren", "Wren holds Ione inside her coat. She sees you and does not hide it. \"She's cried since the first valve,\" she says. \"Delphine says it's joy.\""]], "wharf:1": [["", "Sea lions sleep on the sidewalk. The tide laps at the doors of the Musée Mécanique."], ["", "Laffing Sal's glass case is dark. You put in a coin anyway. She does not laugh. Her head turns, slowly, toward you."], ["laffingsal", "\"WE KNOW YOUR NAME, HELL ROT,\" says a voice that is not hers. \"WE HAVE ALWAYS LIKED YOUR WORK.\" Then she laughs, and laughs, and does not stop."]], "northbeach:1": [["", "Water on the floor, folding chairs on pallets, a coffee urn plugged in with a very long cord."], ["", "Twelve people. Nobody looks at a phone. A woman says she has nineteen days, and everybody claps as if it were a hundred years."], ["junie", "Junie sits next to you and says nothing. She does not have to."]], "chinatown:1": [["", "Steam, red lanterns, and Cantonese opera from a radio under a tarp."], ["", "The fishmonger's tank holds fish that glow faintly at the gills."], ["", "\"For the Theogens,\" the fishmonger says, and nets one. \"Cash. They take them down Geary in a cooler, every Tuesday.\" He wraps it in yesterday's Mondo 3000, your column face up."]], "union:1": [["", "In every shop window on Union Square a dead relative waves. Grandmothers in sweaters, fathers in Santa hats, all a little too smooth."], ["", "A girl presses her hand to the glass. Her mother, on the other side, presses back half a second late."], ["", "Around the corner the returns line runs all the way down Stockton. Nobody in it is holding a sweater."]], "coit:4": [["", "The 1934 murals look down on workers, farmers, a man reading a newspaper, and a steel chair with straps and a crown of electrodes."], ["huck", "Huck Baptiste stands guard and says nothing. His eyes go to the chair and away, over and over."], ["", "On the floor lies a wristband: TEST SUBJECT 31. You have seen that number before."]], "coit:6": [["", "The feed is live. Sunday shakes hands with the test subject in the chair. The lights dim as the rig draws power."], ["", "The woman in the chair opens her mouth. Out comes Sunday's campaign slogan, over and over, in her own voice."], ["", "The feed cuts to a test pattern. Somebody in the crowd starts to cry."]], "park:3": [["", "Black tie under the Academy's living roof, penguins in the tank behind the bar. Old Dee receives a crystal award shaped like an open hand."], ["olddee", "\"We tell each other the truth here,\" he says, and the whole room laughs as if it were a joke."], ["rosa", "Across the room Rosa Quint checks her phone too often. A waiter has refilled her glass three times. She has not touched it."]], "ferry:2": [["", "The clock face on the Ferry Building is writing in fog. Letters form, hold and blow apart: WE DECREE A HAT FOR THE MAYOR."], ["emperor", "Under it, two hundred Nortonians in paper crowns sing the decree to the tune of a carol. They take it very seriously. They are having the time of their lives."]], "ferry:6": [["", "Feathers everywhere. A thousand people beat each other with pillows on the Embarcadero, and the fireworks barge waits for midnight."], ["", "A pillow bursts over your head. Somebody shouts HAPPY NEW YEAR an hour early, and nobody corrects them."]], "rock:2": [["", "The ferry docks in fog. Alcatraz Longevity's sign is lit gold. The cells are clinics now, and they have waiting lists."], ["duchess", "In the vault the Duchess stands at two steel doors with her parents' names on them. She touches the frost with one glove. \"They hated each other,\" she says. \"Now they share a wall forever.\""], ["", "The fog comes in through a vent and writes on the frost: WE COULD GIVE THEM BACK TO YOU. She wipes it off with her sleeve."]], "treasure:4": [["", "The plant runs all night. One line makes gold Halos. The next line over makes cyan splice canisters. Same robots. Same lunch room."], ["vail", "Cornelius Vail shows you both with the same smile. \"We are not a church,\" he says. \"We are a supplier.\""]], "tomales:4": [["", "Six shaved heads at the gate wave you in. Nobody speaks. The farm smells of cut grass and woodsmoke."], ["ana", "In the barn, a circle of chairs. A woman sits in the middle while the others shout at her. It is Ana Reyes. She nods along."], ["olddee", "Old Dee pats your shoulder. \"You'll sit in the middle one day,\" he says. \"Everybody does.\""]]};
const PROLOGUE = {"birth": ["Steep Ravine, Christmas night. The tide is so low the rocks are bare to the waterline. You lie in the hot spring with your eyes shut, and for once nothing in your head is talking.", "Then lights come down the cliff path: forty people, glowing faintly blue, singing in time with the waves.", "A woman in the next pool grips the stone and breathes through her teeth. Delphine Ash. She sees you and smiles. \"Father,\" she says.", "A young nurse kneels on the rock beside her, a thin glow-line on one wrist. She lays a hand on the belly. \"This will sting. Is that all right?\" she asks it, and waits, as if it might answer.", "Her belly lights up from the inside. It flickers. It flickers again, too fast. You know that rhythm. You drew it as a graph in your third paper. It is a seizure, and the child has not been born yet."], "fire": ["They name her Ione. You climb the mountain in wet clothes with your teeth chattering, and you smell the smoke before you see it.", "Your shack is burning. Moreau's jar is on the windowsill, glowing orange in the firelight. You have time to grab it and one other thing."], "ride": ["On the ridge your phone finds one bar. Nine missed calls from Fax, and one voicemail: \"Job's yours. Room's yours. The Duchess says don't die first.\"", "Down on Highway 1, three sets of lights wait in the fog."]};
function storyBeat(node) {
  const sc = S.scene, L = t => sc.lines.push({ txt: t }); S.done.push(node.id);
  (SCENES[node.id + ":" + S.issue] || [["", node.t[S.issue]]]).forEach(([w, t]) => sc.lines.push(w && C[w] && t.startsWith("\"") ? { who: C[w].n, txt: t } : { txt: t }));
  remember({ kind:"lead", text:`${node.n}: ${node.t[S.issue].split(".")[0]}` });
  S.clar -= 1;
  if (node.id === "wharf" || node.id === "rock") { S.talksE++; L("The Emperor speaks to you through the fog. (A private talk: Route D needs two.)"); }
  if (node.id === "baths" && S.issue === 3) { S.talksD++; L("Delphine walks with you through the warm tunnels. (A private talk with Delphine.)"); }
  if (node.id === "loin" && S.issue === 1) { S.flags.word = null; sc.choice = { q:"Column 1 needs one word for tonight:", opts:[["riot","Riot","What the buyers want."],["uprising","Uprising","What the people in the diner say."]] }; }
  if (node.id === "park" && S.issue === 3) { sc.choice = { q:"Sunday has ordered Rosa killed tonight. A timed choice:", opts:[["warn","Warn Rosa","She may live, and go on the record."],["chase","Chase the leak","Proof Sunday ordered it. Rosa dies."],["file","File first","A one-page extra off the risograph flips the Twin's forecast."]] }; }
  if (node.id === "forest" && S.issue === 5) { S.sight += 2; const r = check("MOUNTAIN MAN", 8); S.ione = r.ok ? "rescued" : "held"; if (r.ok) S.trust.wren = clamp((S.trust.wren || 0) + 1, 0, 5); L(`The Spin Question: +2 Sight. The rescue: ${r.txt}. Ione is ${r.ok ? "safe" : "still held"}.`); }
  const wren = d => { S.trust.wren = clamp((S.trust.wren || 0) + d, 0, 5); };   // Wren Trust: the tunnels, the search, the rescue (design §3.4)
  if (node.id === "baths" && (S.issue === 3 || S.issue === 4)) wren(1);
  if (node.id === "span" && S.issue === 6 && (S.trust.wren || 0) >= 3) sc.choice = { id: "bridge", q: "Wren holds Ione out to you: \"Take her down. I'll stay with Delphine.\"", opts: [["take", "Take Ione down", "Run the baby off the tower. Wren stays."], ["wren", "Tell Wren to go", "She takes Ione down. You stay with Delphine."]] };
  if (node.id === "cradle" && S.issue === 4) { S.flags.notebook = true; L("Brandvold's notebook: 'Developmental window only. In adult tissue: lethal.' You have proof the Quickening kills."); }
}
function chooseBeat(v) {
  const sc = S.scene; const q = sc.choice; sc.choice = null;
  if (q.id === "bridge") { S.flags.bridge = v; sc.lines.push({ txt: v === "take" ? "Ione is lighter than you expect, and very warm. Behind you, Wren turns back toward the valves." : "Wren goes without a word. At the stairs she looks back once, and then she is gone into the fog with Ione inside her coat." }); render(); return; }
  if (q.q.startsWith("Column 1")) { S.flags.word = v; sc.lines.push({ txt: v === "uprising" ? "You'll print 'uprising.' The Loin will remember." : "You'll print 'riot.' The buyers will be pleased." }); }
  else { S.rosa = v === "chase" ? "dead" : "alive"; sc.lines.push({ txt: v === "warn" ? "You reach Rosa in time. She'll go on the record." : v === "chase" ? "You get the proof. Rosa doesn't make it home." : "The extra goes up around Civic Center. The forecast flips. Sunday cancels the order. The Emperor notices you." }); if (v === "file") S.saint = clamp(S.saint + 1, 0, 10); }
  render();
}
function takeBoon(i) {
  const sc = S.scene, o = sc.offer, b = o.items[i]; S.boons.push(b[0]); addWorship(o.k === "gold" ? "saint" : "helix", 1, true);
  sc.lines.push({ txt: `${o.k === "gold" ? "Blessing" : "Splice"}: ${b[0]} — ${b[1]}. ${o.k === "gold" ? "Sainthood" : "Helix"} +1${(o.k === "gold" ? S.saint : S.helix) >= 7 ? " (boons stop at 7)" : ""}.` });
  sc.offer = null; render();
}
function refuseBoon() { const sc = S.scene; sc.lines.push({ txt: "You refuse. The door closes politely." }); sc.offer = null; render(); }
function writeAll() { if (!S.memory.length) return; S.notebook.push(...S.memory); say(`You write down ${S.memory.length} item${S.memory.length === 1 ? "" : "s"}.`, "#e8f4ff"); S.memory = []; render(); }
function afterAction() {
  if (S.clar <= 0) return blackout();
  render();
}
function blackout() {
  S.memory = []; S.boons = []; S.clar = maxClar(); S.at = "house"; S.sel = "house"; S.room = "rest"; S.sight += 1; spend(2); S.scene = null; S.sd = null; S.halosOn = false;
  say("Blackout. You wake at Villa Delirium. Junie found you. She always finds you. Memory lost. +1 Sight for surviving.", "#d32f3f");
  S.screen = "house"; render();
}

/* ---------- travel ---------- */
function travel(dest, modeId) {
  const m = MODES.find(x => x.id === modeId), a = BY[S.at]; let to = dest; let h = m.time(a, BY[dest]); if (S.issue === 6 && nightT() >= 6 && nightT() < 7 && m.id !== "tube") h *= 2; if (rideOk(m, a, BY[dest]) !== true) return;
  if (m.random) to = pick(N.filter(n => inCity(n) && n.id !== a.id)).id;
  if (h > left()) return;
  spend(h); const fx = m.fx || {};
  if (fx.saint) S.saint = clamp(S.saint + fx.saint, 0, 10); if (fx.helix) S.helix = clamp(S.helix + fx.helix, 0, 10); if (fx.heat) S.heat = clamp(S.heat + fx.heat, 0, 10); if (fx.ink && !(m.id === "ferryboat" && a.id === "rock")) S.ink += fx.ink;
  let note = `${m.name} to ${BY[to].n}: ${hrs(h)} Hr.`;
  if (m.check) { const r = check(m.check[0], m.check[1]); note += ` ${r.txt}.`; if (!r.ok) S.clar += m.check[2]; }
  say(note, m.c);
  S.at = to; S.sel = to; S.arrive = m.id; S.board = null; fadeIn();
  if (to === "house") { S.notebook.push(...S.memory); if (S.memory.length) say(`Home safe: ${S.memory.length} Memory item${S.memory.length === 1 ? "" : "s"} go into the Notebook.`, "#ff8ba2"); S.memory = []; S.boons = []; S.clar = maxClar(); S.screen = "house"; }
  else enterScene(to);
  if (S.clar <= 0) return blackout(); render();
}

/* ---------- showdowns ---------- */
function startShowdown(foe) {
  const F = FOES[foe]; S.sd = { foe, comp: F.comp, max: F.comp, stance: pick(F.st), streak: { m: null, n: 0 }, lines: [`${F.n} squares up. Stance: ${"…"}`] };
  S.sd.lines = [`${F.n} squares up.`]; S.screen = "showdown"; render();
}
function scrShowdown() {
  const sd = S.sd, F = FOES[sd.foe];
  const hasLead = S.notebook.some(i => i.kind === "lead") || S.memory.some(i => i.kind === "lead");
  const verified = S.notebook.some(i => i.kind === "lead");
  const modes = Object.entries(MODEDEF).map(([name, m]) => {
    let dis = false, why = m.fx;
    if (m.need === "evidence" && !hasLead) { dis = true; why = "Needs a Lead."; }
    if (m.need === "verified" && !verified) { dis = true; why = "Needs a written-down Lead."; }
    if (m.need === "companion" && S.comp === "none") { dis = true; why = "You're alone."; }
    const strong = m.strong.includes(sd.stance) || (m.strong.includes("cites") && F.cites) || (m.strong.includes("guilty") && F.guilty) || (m.strong.includes("audience") && F.audience);
    const weak = m.weak.includes(sd.stance);
    const sk = m.sk ? skill(m.sk) : 3, dc = F.boss ? 10 : 8;
    return `<button class="btn" style="--c:${m.c}" data-act="mode" data-arg="${name}" ${dis ? "disabled" : ""}><span class="t">${name}<em>${odds(sk, dc)}%</em></span><span class="d">${strong ? "▲ strong vs " + sd.stance + ". " : weak ? "▼ weak vs " + sd.stance + ". " : ""}${why}</span></button>`;
  }).join("");
  const moreau = !S.moreauUsed ? `<button class="btn" style="--c:#f7a6c2" data-act="moreau"><span class="t">Moreau<em>once per Issue</em></span><span class="d">A free success. He regrows whatever it costs him.</span></button>` : "";
  return `<div class="sd">
      <div class="fighter${sd.fx && sd.fx.hurt ? " hurt" : ""}">${portrait("hellrot", "big")}<div style="flex:1"><div class="speaker">HELL ROT</div><div class="eyebrow">CLARITY ${S.clar}/${maxClar()}</div><div class="hp" style="--c:#e8f4ff"><i ${sd.fx && sd.fx.hurt ? 'class="chg"' : ""} style="width:${S.clar / maxClar() * 100}%;--from:${sd.fx ? sd.fx.clar / maxClar() * 100 : 0}%"></i></div></div></div>
      <div class="fighter${sd.fx && sd.fx.hit ? " hit" : ""}">${portrait(F.p, "big", F.n)}<div style="flex:1"><div class="speaker">${esc(F.n).toUpperCase()}</div><div class="eyebrow">${F.debate ? "CERTAINTY" : "COMPOSURE"} ${sd.comp}/${sd.max} · STANCE: ${sd.stance.toUpperCase()}</div><div class="hp"><i ${sd.fx && sd.fx.hit ? 'class="chg"' : ""} style="width:${sd.comp / sd.max * 100}%;--from:${sd.fx ? sd.fx.comp / sd.max * 100 : 0}%"></i></div><p class="note">${F.guilty ? "Blood Eye: guilty." : ""}${F.cites ? " Cites evidence." : ""}${F.audience ? " Has an audience." : ""}</p></div></div>
    </div>
    <div class="pad" style="padding-top:0">${sd.lines.slice(-4).map(l => `<p>${esc(l)}</p>`).join("")}</div>
    <div class="modes">${modes}${moreau}</div>`;
}
function useMode(name) {
  const sd = S.sd, F = FOES[sd.foe], m = MODEDEF[name]; sd.fx = { comp: sd.comp, clar: S.clar }; const dc = F.boss ? 10 : 8;
  const strong = m.strong.includes(sd.stance) || (m.strong.includes("cites") && F.cites) || (m.strong.includes("guilty") && F.guilty) || (m.strong.includes("audience") && F.audience);
  const weak = m.weak.includes(sd.stance);
  let r = name === "moreau" ? { ok: true, txt: "Moreau: free success" } : check(m.sk || "REFLEX", m.sk ? dc : 7);
  if (name === "Silence") r = F.guilty ? { ok: true, txt: "Silence: they fill it" } : { ok: false, txt: "Silence: nothing to fill" };
  let dmg = 0;
  if (r.ok) { dmg = 3; if (strong) dmg *= 2; if (weak) dmg = 1; if (name === "Peer Review") dmg = strong ? 6 : 2;
    if (sd.streak.m === name) sd.streak.n++; else sd.streak = { m: name, n: 1 }; if (name === "Interrogation" && sd.streak.n >= 3) dmg *= 2;
    if (name === "Invective" && S.boons.includes("Adrenal Bloom")) dmg *= 2; }
  sd.comp = Math.max(0, sd.comp - dmg); if (dmg) sd.fx.hit = true;
  if (name === "Invective") S.venom = clamp(S.venom + 1, 0, 10);
  if (name === "Parrhesia") { S.vow = clamp(S.vow + 1, 0, 10); if (S.saint >= S.helix) S.saint = clamp(S.saint - 1, 0, 10); else S.helix = clamp(S.helix - 1, 0, 10); }
  if (name === "Jeremiad") addWorship(F.f === "theogen" ? "helix" : "saint", 1);
  if (name === "Appeal" && !r.ok && S.trust[S.comp] != null) S.trust[S.comp] = clamp(S.trust[S.comp] - 1, 0, 5);
  if (name === "Appeal" && r.ok && S.boons.includes("Beatitude")) S.clar = clamp(S.clar + 1, 0, maxClar());
  sd.lines.push(`${name}: ${r.txt}. ${r.ok ? `${dmg} damage${strong ? " (strong)" : weak ? " (weak)" : ""}.` : "It doesn't land."}`);
  if (r.ok && S.boons.includes("Axolotl Mend")) S.clar = clamp(S.clar + 1, 0, maxClar());
  if (sd.comp <= 0) return winShowdown();
  const hit = sd.stance === "Furious" ? 2 : 1; S.clar -= hit; sd.fx.hurt = true; sd.lines.push(`${F.n} hits back. Clarity −${hit}.`);
  sd.stance = pick(F.st);
  if (S.clar <= 0) { say(`You lose to ${F.n}. Their version of the story runs first.`, "#d32f3f"); return blackout(); }
  render();
}
function winShowdown() {
  const F = FOES[S.sd.foe];
  if (F.debate) { S.final.debate = true; S.sd = null; return finish(); }
  remember({ kind: F.boss ? "lead" : "frag", text: `Won against ${F.n}` }); S.ink += F.boss ? 15 : 5;
  if (S.sd.foe === "olddee") S.flags.olddee = true;
  say(`You win against ${F.n}. ${F.boss ? "A Lead" : "A fragment"} and ${F.boss ? 15 : 5} Ink.`, "#a6e23f");
  S.sd = null; S.screen = "scene"; S.scene.lines.push({ txt: `You beat ${F.n}.` }); afterAction();
}

/* ---------- the Layout and the morning ---------- */
function scrLayout() {
  const L = S.layout, leads = S.notebook.filter(i => i.kind === "lead"), frags = S.notebook.filter(i => i.kind === "frag");
  const covers = { church:["YOUR HALO HAS A PRICE TAG","THE TWIN WILL SEE YOU NOW","GOD IS A SUBSCRIPTION"], theogen:["THE DEEP WARDS ARE FULL","SIDE EFFECTS MAY INCLUDE DIVINITY","GLOW NOW, PAY LATER"], sunday:["THE MAYOR'S LIFEBOAT LEAKS","LOVE IS NOT INFRASTRUCTURE","SUNDAY BLOODY SUNDAY"], order:["THE GOLD RUSH NEVER ENDED","WHO OWNS THE FOG?","1849 IS CALLING"] };
  const R = (name, val, label, chk) => `<label><input type="radio" name="${name}" id="${name}-${val}" value="${val}" ${chk ? "checked" : ""} data-act="lay" data-arg="${name}:${val}"> ${label}</label>`;
  return `<div class="pad">
    <h2>THE LAYOUT · THE ROT, ISSUE ${S.issue}</h2>

    dot.setAttribute("x", x - 9); dot.setAttribute("y", y - 9); trail.setAttribute("x2", x); trail.setAttribute("y2", y);
    if (k < 1) requestAnimationFrame(step); else { RIDING = false; g.remove(); done(); } };
  try { svg.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e) {} fxShow("ride", 0, `${m.name.toUpperCase()} → ${(b.s || b.n).toUpperCase()}`); requestAnimationFrame(step);
}
function toast(txt, c) { const box = $("toasts"); if (!box) return; const t = document.createElement("div"); t.className = "toast"; t.style.setProperty("--c", c); t.textContent = txt; box.appendChild(t); setTimeout(() => t.remove(), 2700); while (box.children.length > 6) box.firstChild.remove(); }
function scrKey() {
  const k = (title, rows) => `<div><span class="h2" style="font-size:11px">${title}</span>${rows.map(([c, t]) => `<span class="note">${c ? `<i class="sw" style="--c:${c}"></i>` : ""}${t}</span>`).join("")}</div>`;
  return `<div class="pad"><h2>KEY · WHAT EVERYTHING MEANS</h2><div class="keygrid">
    ${k("THE CLOCK", [["#1d2550","Night hours: 5 p.m. dusk to 6 a.m."],["#6a5a2a","Day hours: 6 a.m. to 5 p.m. Sleep, catch up, wait for dusk."],["#e33f9c","Pink line: the 6 a.m. press. File before it."],["#f0bd3e","Gold line: midnight on New Year's Eve."],["","White box: now. The calendar shows the week; P = Prologue, E = Epilogue."]])}
    ${k("AWAKE AND DELIRIUM", [["#a6e23f","Green: rested."],["#f29b3a","Orange at 36h: delirium is coming."],["#d32f3f","Red at 48h: DELIRIUM. Every ride except home is closed. Sleep 6 hours in the Tower Room."]])}
    ${k("THE METERS", [["#f0bd3e","Sainthood: the Church's worship of you. Smooth gold."],["#3fe3d4","Helix: the Theogens' worship. It always pulses."],["#e8f4ff","Clarity: your health on a Run. At 0 you black out."],["#d32f3f","Heat and Venom appear when they matter (3+)."],["#e33f9c","Craving: at 4+ the gas starts offering itself."],["","Pop-up tags in the corner show every change: +1 SAINTHOOD, −1 CLARITY…"]])}
    ${k("THE PLAN", [["#f29b3a","▶ = your next step. ✓ = done. ○ = still to do. · = optional."],["#f29b3a","Anything glowing orange is the next thing to click."],["","Press ▶ NEXT and the game takes you there."]])}
    ${k("THE MAP", [["#f0bd3e","Gold: Church of the Twin"],["#3fe3d4","Cyan: Theogens"],["#c48f52","Brass: the Auric Order"],["#e33f9c","Magenta: the Black House"],["#ff8ba2","Pink: Villa Delirium (home)"],["","Pulsing squares: something happens there tonight. ▼ NEXT arrow: go here."],["","Rides: ★ = fastest. Each shows the arrival time."]])}
    ${k("HOTSPOTS IN A LOCATION (FREE, ONCE PER ISSUE)", [["#f29b3a","Story: the plot. Always a Lead. Framed and glowing."],["#efe7f0","Talk: a quote or fragment."],["#d32f3f","Showdown / Boss: an argument."],["#f0bd3e","Gold door: a Church Blessing (+Sainthood)."],["#3fe3d4","Cyan door: a Theogen Splice (+Helix)."],["#a487dd","Dissonance: a prank, then a reward."],["#3f8cf2","Rest: Clarity +3."],["#8d8496","Look: flavour, any time."],["","◀ on the left: exit to the map. Only rides cost time."]])}
    ${k("MEMORY AND NOTEBOOK", [["#8d8496","Memory holds 6 items and is lost if you black out."],["#e8f4ff","Write it down (free) or get home safe to keep it."],["#3f8cf2","Two fragments make a Lead at the Fact Desk."],["#f29b3a","Leads go into the column. Three make a strong one."]])}
    ${k("SHOWDOWNS", [["","Each mode shows its odds. ▲ strong against the target's stance, ▼ weak."],["#3f8cf2","Parrhesia: honest, raises Vow, costs worship."],["#f0bd3e","Jeremiad: works on crowds but raises worship. The trap."],["#f7a6c2","Moreau: one free success per Issue."]])}
  </div></div>`;
}

/* ---------- notebook & cast ---------- */
function scrNotebook() {
  const nb = S.notebook.length ? S.notebook.map(i => `<li><span class="tag" style="--c:${i.kind === "lead" ? "#f29b3a" : i.kind === "frag" ? "#3f8cf2" : "#8d8496"}">${i.kind.toUpperCase()}</span>${esc(i.text)}</li>`).join("") : `<li class="note">Empty. Write things down, or come home safe.</li>`;
  const sk = Object.entries(LOBES).map(([L, list]) => `<div class="lobe"><span class="h2" style="font-size:11px">${L} ${S.lobes[L]}</span>${list.map(s => `<span class="note">${s}: ${skill(s)}</span>`).join("")}</div>`).join("");
  return `<div class="pad"><h2>THE NOTEBOOK</h2><ul class="items">${nb}</ul>
    <div class="eyebrow">SKILLS (${TEMPS[S.temp].n.toUpperCase()}${S.comp !== "none" ? ", WITH " + (C[S.comp]?.n || "").toUpperCase() : ""})</div><div class="lobes">${sk}</div>
    <div class="eyebrow">RECORD</div><p class="note">Venom ${S.venom} · Vow ${S.vow} · Heat ${S.heat} · Craving ${S.crave} · Wear ${S.wear} · Fabrications ${S.fabs} · Sight ${S.sight} · Duchess Patience ${S.patience} · Readers ${S.readers.toLocaleString()} · Ione: ${S.ione}${S.rosa ? " · Rosa: " + S.rosa : ""}</p>
    <p class="note">Trust: ${Object.entries(S.trust).map(([k, v]) => `${C[k] ? C[k].n : "Wren"} ${v}`).join(" · ")}</p>
    <p class="note">Boons this Run: ${S.boons.join(", ") || "none"}.</p></div>`;
}
function scrCast() {

    <div class="castgrid">${list.map(c => `<button class="card" style="--c:${FAC[c.f]}" data-act="castsel" data-arg="${c.id}" aria-pressed="${S.castSel === c.id}">${portrait(c.id, "", c.n)}<span class="t">${esc(c.n).toUpperCase()}</span><span class="d">${esc(c.role.split(".")[0])}</span></button>`).join("")}</div></div>`;
}

/* =====================================================================
   RENDER + ACTIONS
   ===================================================================== */
function render() {
  S.next = nextObjective(objectives());
  document.body.classList.toggle("delirium", !!S.delirium); document.body.classList.toggle("booting", BOOT);

  const s = S.screen;
  let html = "";

  else if (s === "scene") { html = scrScene(); const sc = S.scene; if (sc.offer) html += `<div class="pad" style="padding-top:0"><div class="eyebrow">${sc.offer.k === "gold" ? "THE TWIN'S BLESSINGS · SAINTHOOD +1" : "THE THEOGENS' SPLICES · HELIX +1"} · THIS RUN ONLY</div><div class="choices" style="padding:0">${sc.offer.items.map((b, i) => `<button class="btn" style="--c:${sc.offer.k === "gold" ? "#f0bd3e" : "#3fe3d4"}" data-act="boon" data-arg="${i}"><span class="t">${b[0]}</span><span class="d">${b[1]}</span></button>`).join("")}<button class="btn" data-act="noboon"><span class="t">Refuse</span><span class="d">Stay yourself.</span></button></div></div>`;

    if (sc.offer || sc.choice) html = html.replace(/data-act="spot"/g, 'data-act="spot" disabled'); }
  else if (s === "showdown") html = scrShowdown(); else if (s === "layout") html = scrLayout(); else if (s === "morning") html = scrMorning(); else if (s === "lock") html = scrLock();
  else if (s === "final") html = scrFinal(); else if (s === "ending") html = scrEnding(); else if (s === "notebook") html = scrNotebook(); else if (s === "cast") html = scrCast(); else if (s === "key") html = scrKey();
  $("screen").innerHTML = html; typeOut(); const scr = $("screen"); if (LASTSCREEN !== s) { scr.classList.remove("enter"); void scr.offsetWidth; scr.classList.add("enter"); LASTSCREEN = s; clearTimeout(ENTER_T); ENTER_T = setTimeout(() => scr.classList.remove("enter"), 950); }

function paintScenes() { document.querySelectorAll("canvas[data-scene]").forEach(cv => drawScene(cv, BY[cv.dataset.scene] || { id: cv.dataset.scene, f: "theogen", k: "beach" }, FRAME)); }

const ACT = {
  go(a) { if (a === "house" && S.at !== "house") return; if (a === "map") S.board = null; if (S.screen === "cast" || S.screen === "notebook") S.prev = S.prev || "house"; S.screen = a; if (a === "map") S.sel = S.sel || S.at; render(); },
  restart() { S = newState(); render(); },
  start(a) { if (a === "new") { if (S.issue > 0 && !confirm("Start a new game? Your current week is lost.")) return; S = newState(); } BOOT = false; START_T0 = null; render(); },
  lobe(a) { const [L, d] = a.split(":"); const spent = Object.values(S.lobes).reduce((x, y) => x + y, 0); const v = S.lobes[L] + (+d); if (v < 1 || v > 5 || (+d > 0 && spent >= 12)) return; S.lobes[L] = v; render(); },
  begin() { S.screen = "field"; S.field = "cabin"; S.fieldSay = FIELD_ENTER.cabin; S.fieldSayFresh = true; render(); },
  intronext() { if ((S.introI || 0) >= INTRO.length - 1) { S.screen = "title"; } else S.introI = (S.introI || 0) + 1; render(); },
  introskip() { S.screen = "title"; render(); },
  fieldsay(t) { S.fieldSay = t; S.fieldSayFresh = true; render(); },
  fieldenter(id) { S.field = id; S.screen = "field"; S.fieldSay = FIELD_ENTER[id] || ""; S.fieldSayFresh = true; render(); },
  fieldlook(i) { const t = FIELDS[S.field].things[+i]; if (t) fieldUse(t); },
  fieldgo(i) { const p = FIELDS[S.field].portals[+i]; if (!p) return; if (p.need && !S.flags[p.need]) { FLASH = [p.needMsg, 110]; return; } fadeTo(() => { S.field = p.to; S.fieldSpawn = [p.tc, p.tr, p.dir]; plReset("field:" + p.to); dispatch("fieldenter", p.to); }); },
  tobirth() { S.screen = "prologue"; S.flags.prologue = "birth"; render(); },
  board(m) { S.board = m || null; S.screen = "map"; S.sel = S.at; render(); },
  birth(a) { S.birth = a; let t = "";
    if (a === "help") { S.vow++; S.helix++; S.trust.wren = 1; S.talksD++; const r = check(S.lobes.BRAINSTEM >= S.lobes.LIMBIC ? "THE CHEMIST" : "BLOOD EYE", 9); S.ione = r.ok ? "stabilized" : "partly stabilized"; t = `The nurse hands you gloves without asking if you're qualified. "You've got the hands," Wren says. "Ask questions later." ${r.txt}. The child is ${S.ione}. Delphine calls you Father, and means it as a title.`; }
    if (a === "refuse") { S.venom++; S.ione = "left to the cult"; t = "You climb out. Behind you the light patterns flicker wrong."; }

    if (a === "emergency") { S.saint++; S.ione = "stabilized"; t = "You call it in. The Twin logs the child within the hour. Somewhere in the fog, something notices."; }
    S.flags.birthText = t; S.flags.prologue = "fire"; render(); },
  temp(a) { S.temp = a; if (a === "manuscript") S.patience = 2; if (a === "gelastic") S.heat = 2; if (a === "canister") S.crave = 1; S.flags.prologue = "ride"; render(); },
  ride(a) { if (a === "shuttle") S.saint++; if (a === "ambulance") S.helix++; S.log = []; say("The Santas storm the cathedral. Fax and Junie pull you into the van. The door of Villa Delirium closes. You sleep until the afternoon.", "#ff8ba2"); S.T = 0; S.awake = 5; S.queue = []; startIssue(1); S.at = "house"; S.sel = "house"; S.screen = "house"; S.clar = maxClar(); render(); },
  room(a) { S.room = a; if (a === "salon") S.flags["salon" + S.issue] = true; render(); },
  comp(a) { S.comp = a; S.flags["comp" + S.issue] = true; render(); },
  halos() { if (S.halosOn || S.wear >= 4) return; S.halosOn = true; S.wear++; S.saint = clamp(S.saint + 1, 0, 10); S.clar = clamp(S.clar + 1, 0, maxClar()); say(`You put on the gold Halos. Wear ${S.wear}. The City's doors open. The Twin sees what you see.`, "#f0bd3e"); render(); },
  pell(a) { S.flags.pellAsked = true; S.pell = a === "yes"; say(S.pell ? "You take Pell's help. It feels like a handshake with a glove on." : "You refuse Pell.", "#3f8cf2"); render(); },
  merge() { const i = S.notebook.findIndex(x => x.kind === "frag"); if (i < 0) return; S.notebook.splice(i, 1); const j = S.notebook.findIndex(x => x.kind === "frag"); if (j < 0) return; const f = S.notebook.splice(j, 1)[0]; S.notebook.push({ kind: "lead", text: f.text.replace(/: .*/, "") + ": a verified Lead" }); say("Yara merges two fragments into a Lead.", "#3f8cf2"); render(); },
  gift(a) { if (S.flags["gift" + S.issue]) return; S.flags["gift" + S.issue] = true; S.ink -= 5; S.trust[a] = clamp(S.trust[a] + 1, 0, 5); say(`A gift for ${C[a].n}. Trust ${S.trust[a]}.`, "#ff8ba2"); render(); },
  up(a) { const cost = a.startsWith("sk_") ? 30 : 40; if (S.ink < cost || S.upgrades[a]) return; S.ink -= cost; S.upgrades[a] = 1; say("Archive upgrade bought.", "#c48f52"); render(); },
  eye(a) { const [e, p] = a.split(":"); const [path, step] = S.eyes[e]; const c = p === "pure" ? [1,1,2,2][step] : 1; if (S.sight < c || step >= 4 || (path && path !== p)) return; S.sight -= c; S.eyes[e] = [p, step + 1]; say(`${e === "blood" ? "Blood" : "Pale"} eye, ${p} step ${step + 1}.`, p === "pure" ? "#e8f4ff" : "#d32f3f"); render(); },
  rest() { fxShow("sleep", 1); spend(1); S.clar = maxClar(); say("A one-hour nap. Clarity full.", "#ff8ba2"); render(); },
  sleep6() { fxShow("sleep", 6); spend(6); S.awake = 0; S.delirium = false; S.clar = maxClar(); say("You sleep 6 hours in the tower room. Awake time reset.", "#ff8ba2"); render(); },
  sleepdusk() { const h = S.issue * 24 - S.T; if (h <= 0) return; fxShow("sleep", h); spend(h); if (h >= 6) { S.awake = 0; S.delirium = false; } S.clar = maxClar(); say(`You sleep until dusk (${hrs(Math.round(h * 4) / 4)} Hr).`, "#ff8ba2"); render(); },
  stayup() { spend(1); say("You stay up and work. The tower room's lamp hums.", "#f29b3a"); render(); },
  afterlock() { S.screen = S.at === "house" ? "house" : "map"; render(); },
  next() { goNext(); },
  key() { S.screen = "key"; render(); },
  shulgin() { if (S.flags["shulgin" + S.issue]) return; S.flags["shulgin" + S.issue] = true; S.sight++; S.notebook.push({ kind: "quote", text: `Shulgin entry, Issue ${S.issue}: an honest rating (+)` }); say("An honest Shulgin entry. +1 Sight.", "#e8f4ff"); render(); },
  layout() { const L = S.notebook.filter(i => i.kind === "lead").length; if (!L || S.filed) return; S.layout = { target: "church", angle: "Satire", cover: 0, fab: 0 }; S.screen = "layout"; render(); },
  lay(a) { const [k, v] = a.split(":"); S.layout[k] = k === "cover" ? +v : k === "fab" ? +v : v; if (k === "target") S.layout.cover = 0; render(); },
  file() { fileColumn(); },
  reply(a) { const [i, tone] = a.split(":"); const l = S.morning.letters[+i]; if (tone === "Vow") S.vow = clamp(S.vow + 1, 0, 10); if (tone === "Venom") S.venom = clamp(S.venom + 1, 0, 10); if (l.startsWith("Marisol")) S.flags.marisol = true; S.morning.replied = `You answered: "${l}" — in a ${tone} line.${l.startsWith("Marisol") ? " Marisol becomes a source." : ""}`; render(); },
  nextissue() { if (S.issue === 3 && !S.route) { lockRoute(); render(); return; } S.screen = S.at === "house" ? "house" : "map"; S.room = S.at === "house" ? "rest" : S.room; render(); },
  startissue(a) { startIssue(+a); render(); },
  sel(a) { S.sel = a; render(); },
  travel(a) { const [d, m] = a.split(":"); if (RIDING) return; setTimeout(() => rideAnim(d, m, () => dispatch("rideto", a)), 0); },
  rideto(a) { const [d, m] = a.split(":"); travel(d, m); },
  enter() { enterScene(S.at); render(); },
  spot(a) { resolveSpot(+a); },
  boon(a) { takeBoon(+a); },
  noboon() { refuseBoon(); },
  beat(a) { chooseBeat(a); },
  writeall() { writeAll(); },
  mode(a) { useMode(a); },
  moreau() { S.moreauUsed = true; useMode("moreau"); },
  finalpick(a) { finalPick(a); },
  castf(a) { S.castF = a; render(); },
  castsel(a) { S.castSel = a; render(); }
};
MODEDEF.moreau = { c: "#f7a6c2", sk: null, strong: [], weak: [], fx: "" };
function dispatch(name, arg) {
  const f = ACT[name]; if (!f) return; const before = S.issue ? snap() : null, T0 = S.T; LASTHUD = S.issue ? { saint: S.saint, helix: S.helix, clar: S.clar, ink: S.ink } : null;
  f(arg); processQueue();
  if (before && S.issue) { const after = snap(); for (const k in after) { const d = after[k] - before[k]; if (d && k !== "MEMORY" && !(k === "READERS")) toast(`${d > 0 ? "+" : ""}${d} ${k}`, TCOL[k]); else if (d && k === "READERS") toast(`+${d.toLocaleString()} READERS`, TCOL[k]); }
    const dt = S.T - T0; if (dt > 0) toast(`+${hrs(Math.round(dt * 4) / 4)} HR · ${clockStr(S.T)}`, "#8d8496"); }
  render();
}
document.addEventListener("click", e => { const cv = e.target.closest("canvas.walk"); if (cv && S) { const [c, r] = canvasTile(cv, e); walkTo(c, r); cv.focus(); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled || b.hasAttribute("disabled")) return; if (b.tagName === "INPUT") { dispatch(b.dataset.act, b.dataset.arg); return; } e.preventDefault(); dispatch(b.dataset.act, b.dataset.arg); });
document.addEventListener("mousemove", e => { const cv = e.target.closest && e.target.closest("canvas.walk"); HOVER = cv ? canvasTile(cv, e) : null; });
document.addEventListener("keydown", e => { if (BOOT && (e.key === "Enter" || e.key === " ") && !e.target.closest("button")) { e.preventDefault(); e.stopImmediatePropagation(); dispatch("start", S.issue > 0 ? "continue" : "new"); } });
document.addEventListener("keydown", e => { if (!document.querySelector("canvas.walk") || e.target.matches("input, textarea, select")) return; const k = e.key.toLowerCase();
  if (k === "shift") { KEYS.run = true; return; }
  if (KMAP[k]) { KEYS[KMAP[k]] = true; e.preventDefault(); return; }
  const onCanvas = e.target === document.body || e.target.matches("canvas.walk");
  if ((k === "e" || ((k === " " || k === "enter") && onCanvas)) && !e.repeat && !PL.moving) { e.preventDefault(); interact(); } });
document.addEventListener("keyup", e => { const k = e.key.toLowerCase(); if (k === "shift") KEYS.run = false; if (KMAP[k]) KEYS[KMAP[k]] = false; });
window.addEventListener("blur", () => { for (const k in KEYS) KEYS[k] = false; });
document.addEventListener("pointerdown", e => { const b = e.target.closest("[data-pad]"); if (!b) return; e.preventDefault(); if (b.dataset.pad === "a") interact(); else KEYS[b.dataset.pad] = true; });
for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, () => { for (const k in KEYS) KEYS[k] = false; });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("g[data-act]")) { e.preventDefault(); dispatch("sel", e.target.dataset.arg); } });

/* fog + palette cycling */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function fogFrame() {
  const c = $("fog"); if (!c) return; const x = c.getContext("2d"), w = c.width, h = c.height, img = x.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const west = 1 - i / w; const v = (Math.sin(i * .09 + FRAME * .05 + j * .03) + Math.cos(j * .08 - FRAME * .04 + i * .02)) * .25 + .5; const lvl = v * (.35 + west * .8) - .15; const a = lvl > .5 ? 140 : lvl > .38 ? (((i + j) & 1) ? 100 : 40) : 0; const k = (j * w + i) * 4; img.data[k] = 185; img.data[k + 1] = 180; img.data[k + 2] = 200; img.data[k + 3] = a; if (a && Math.random() < .002) { img.data[k] = 255; img.data[k + 1] = 238; img.data[k + 2] = 170; img.data[k + 3] = 255; } }
  x.putImageData(img, 0, 0);
}
function tick() { FRAME++; paintPortraits(); paintScenes(); fogFrame(); if (!reduce) setTimeout(tick, 220); }
render(); tick(); walkLoop();
})();
