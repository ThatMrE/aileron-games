plugins {
  id 'com.android.application'
}

android {
  namespace 'games.aileron.dnachess'
  compileSdk 34

  defaultConfig {
    applicationId 'games.aileron.dnachess'
    minSdk 21
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }

  // Release signing is supplied at build time from a keystore you own — never
  // commit the keystore. Provide these via ~/.gradle/gradle.properties or -P flags:
  //   DNACHESS_STORE_FILE, DNACHESS_STORE_PASSWORD, DNACHESS_KEY_ALIAS, DNACHESS_KEY_PASSWORD
  signingConfigs {
    release {
      if (project.hasProperty('DNACHESS_STORE_FILE')) {
        storeFile file(DNACHESS_STORE_FILE)
        storePassword DNACHESS_STORE_PASSWORD
        keyAlias DNACHESS_KEY_ALIAS
        keyPassword DNACHESS_KEY_PASSWORD
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig project.hasProperty('DNACHESS_STORE_FILE') ? signingConfigs.release : null
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
