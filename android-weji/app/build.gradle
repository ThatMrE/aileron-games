plugins {
  id 'com.android.application'
}

android {
  namespace 'games.aileron.weji'
  compileSdk 34

  defaultConfig {
    applicationId 'games.aileron.weji'
    minSdk 21
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }

  // Release signing is supplied at build time from a keystore you own — never
  // commit the keystore. Provide these via ~/.gradle/gradle.properties or -P flags:
  //   WEJI_STORE_FILE, WEJI_STORE_PASSWORD, WEJI_KEY_ALIAS, WEJI_KEY_PASSWORD
  signingConfigs {
    release {
      if (project.hasProperty('WEJI_STORE_FILE')) {
        storeFile file(WEJI_STORE_FILE)
        storePassword WEJI_STORE_PASSWORD
        keyAlias WEJI_KEY_ALIAS
        keyPassword WEJI_KEY_PASSWORD
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig project.hasProperty('WEJI_STORE_FILE') ? signingConfigs.release : null
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
